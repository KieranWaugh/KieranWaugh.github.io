<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.head_title %}{{ page.head_title }}{% else %}{{ page.short_title | default: page.title }} - {{ site.author.name }}{% endif %}</title>
    <meta name="description" content="{{ page.subtitle | default: site.description | strip_html | escape }}">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    {% include header.html %}

    <main class="container">
        {{ content }}
    </main>

    {% include footer.html %}

    {% if page.citations %}{% include cite-modal.html %}{% endif %}

    <script src="{{ '/script.js' | relative_url }}"></script>
    {% if page.analytics or site.analytics_everywhere %}{% include analytics.html %}{% endif %}
</body>
</html>
