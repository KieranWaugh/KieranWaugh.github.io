# Homepage text (also editable in Pages CMS → Homepage)

bio: "Research scientist and UX researcher with a PhD in Human-Computer Interaction, working across research and practice on how people interact with emerging hardware and software. I own studies end-to-end from framing the question, recruitment and analysis, to the recommendations that follow. I use whichever mix of experiments, behavioural data, interviews, and field observation the question actually needs, so findings explain not just what people do but why. I enjoy seeking open-ended problems where the method has to be built before the question can be answered. My work spans academic and commercial research, and has shipped into released products and developer standards."

