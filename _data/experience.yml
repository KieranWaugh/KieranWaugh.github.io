- title: Research Associate
  where: University of Glasgow
  dates: June 2026 - Present
  description: As part of the UKRI Grasping Data project, I lead research on how
    children perceive personal data. Working with such a young and vulnerable
    group means the research runs under full ethics approval, with
    safeguarding-led consent and elicitation methods I adapt for each age range.
    I design and run structured play-testing sessions, capture multimodal
    behavioural data, to turn what children do into findings the team can act
    on. I also build the tangible prototypes the studies run on, using 3D
    printing and custom electronics. That lets us move from idea to testable
    objects
