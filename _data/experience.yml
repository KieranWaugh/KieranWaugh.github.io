- title: Research Assistant - Immersive Interaction
  where: University of Glasgow
  dates: June 2025 - February 2026
  description: I ran large-scale user studies in XR and VR, across Meta Quest and
    Apple Vision Pro. With three projects running at once, I standardised the
    methodology across both platforms so results stayed consistent and
    comparable, even while the research questions were still taking shape. I
    analysed frame-level behavioural telemetry and built Python pipelines that
    structured, tagged and synthesised complex multimodal datasets into clear
    findings.
- title: Extended Reality Research Intern
  where: Logitech
  dates: Summer 2024
  description: Designed and led user studies for the MX-Ink mixed-reality stylus,
    informing key design decisions in collaboration with Meta that were shipped
    in publicly released software and OS. My research pinpointed discrepancies
    in how humans hold devices and how finger moment affects interaction within
    virtual environments.
- title: Digital Skills Project Research Assistant (Part-time)
  where: Digital Skills Education
  dates: June 2020 - Present
  description: Collaborated with the Scottish government, Education Scotland, and
    national trade unions to pioneer new methods of teaching complex computer
    science. I helped design and launch innovative online learning modules for
    young people while separately developing and delivering hands-on cyber
    skills workshops to enhance the technical competency and digital confidence
    of older adults.
- title: Assistant Technical Program Chair (Volunteer)
  where: ACM CHI Conference 2025
  dates: August 2022 - May 2024
  description: Helped organise CHI' 24, conference of over 4000 attendees. My role
