<div class="timeline-item">
    <div class="timeline-dot"></div>
    <div class="timeline-content">
        <h3>{{ include.item.title }}</h3>
        <p class="timeline-details"><em>{{ include.item.where }} | {{ include.item.dates }}</em></p>
        <p>{{ include.item.description }}</p>
    </div>
</div>
