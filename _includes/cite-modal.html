<div id="cite-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <button class="modal-close" aria-label="Close modal">&times;</button>
        <h3>Cite this work</h3>
        <div class="modal-body">
            <div class="modal-tabs">
                <button class="modal-tab-btn active" data-tab="plain">Plain Text</button>
                <button class="modal-tab-btn" data-tab="bibtex">BibTeX</button>
            </div>
            <div class="modal-tab-panel active" id="modal-tab-plain">
                <pre><code id="cite-text"></code></pre>
                <button class="btn-copy-cite">Copy</button>
            </div>
            <div class="modal-tab-panel" id="modal-tab-bibtex">
                <pre><code id="cite-bibtex"></code></pre>
                <button class="btn-copy-cite">Copy</button>
            </div>
        </div>
    </div>
</div>
